<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - VibePlayer</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="login.css">
</head>
<body>
    <div class="background-circle circle-1"></div>
    <div class="background-circle circle-2"></div>

    <div class="login-container">
        <form id="loginForm">
            <h2>Welcome Back</h2>
            <p class="subtitle">Please enter your details</p>
            
            <div class="input-group">
                <input type="text" id="username" name="username" required placeholder=" ">
                <label for="username">Username</label>
            </div>
            
            <div class="input-group">
                <input type="password" id="password" name="password" required placeholder=" ">
                <label for="password">Password</label>
            </div>

            <button type="submit" class="login-btn">Sign In</button>
            
            <p class="footer-text">Don't have an account? <a href="../signup/signup.html" style="color: #1DB954; text-decoration: none; font-weight: 600;">Sign up</a></p>
        </form>
    </div>

    <script src="login.js"></script>
</body>
</html>
